[project]
name = "tender-agent"
version = "0.1.0"
description = "Autonomous AI agent for Israeli public procurement: tender monitoring, Hebrew document analysis, and eligibility checks"
readme = "README.md"
authors = [
    { name = "rudy002", email = "rudyhaddad.job@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
tender-agent = "tender_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
